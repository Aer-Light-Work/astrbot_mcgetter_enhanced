[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module
markers =
    commands: AstrBot 命令 handler 与文档一致性测试
    presets: preset 配置管理测试
    text_rendering: 文本解析、字体、字重、换行和 UniFont 测试
    image_rendering: 使用 mock 数据生成完整图片的离线测试
    real_server: 依赖真实 Minecraft 服务器的网络测试
    server_ping: 只验证真实服务器状态获取
    server_rendering: 使用真实服务器数据完成整图渲染
    srv_lookup: 使用环境变量提供的 SRV 地址验证 /mcadd 预查询
