# 默认预设配置
presets:
  rich:
    name: "丰富样式"
    style: "rich"
    colors:
      background: [15, 15, 15]
      title: [255, 255, 255]
      text: [220, 220, 220]
      accent: [85, 255, 85]
      player_count: [85, 255, 85]
      version: [170, 170, 170]
      latency_good: [85, 255, 85]
      latency_warn: [255, 170, 0]
      latency_bad: [255, 85, 85]
      timestamp: [120, 120, 120]
      motd_colors:
        "0": [0, 0, 0]
        "1": [0, 0, 170]
        "2": [0, 170, 0]
        "3": [0, 170, 170]
        "4": [170, 0, 0]
        "5": [170, 0, 170]
        "6": [255, 170, 0]
        "7": [170, 170, 170]
        "8": [85, 85, 85]
        "9": [85, 85, 255]
        "a": [85, 255, 85]
        "b": [85, 255, 255]
        "c": [255, 85, 85]
        "d": [255, 85, 255]
        "e": [255, 255, 85]
        "f": [255, 255, 255]
    display:
      show_icon: true
      show_version: true
      show_address: false
      show_latency: true
      show_players: true
      show_motd: true
      show_notes: false
      show_query_time: true
    fonts:
      group_title_size: 44
      title_size: 26
      text_size: 22
      small_size: 18
    layout:
      width: 1177
      padding: 30
      icon_size: 100
      line_spacing: 8
  simple:
    name: "简洁样式"
    style: "simple"
    colors:
      background: [34, 34, 34]
      title: [255, 255, 255]
      text: [255, 255, 255]
      accent: [85, 255, 85]
      latency_good: [85, 255, 85]
      latency_warn: [255, 170, 0]
      latency_bad: [255, 85, 85]
    display:
      show_icon: true
      show_version: true
      show_address: true
      show_latency: true
      show_players: true
      show_motd: false
      show_notes: false
      show_query_time: false
    fonts:
      title_size: 30
      text_size: 20
      small_size: 18
    layout:
      width: 600
      padding: 20
      icon_size: 64
      line_spacing: 5

# 默认 preset
default_preset: "rich"